[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# Applies to the local stack only. The hosted project reads Site URL and
# Redirect URLs from the dashboard, so this block has to be kept in step by hand.
site_url = "https://www.paly.study"
additional_redirect_urls = [
  "paly://confirm",
  "paly:///confirm",
  "paly://reset-password",
  "paly:///reset-password",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600
